[project]
name = "dotacoach"
version = "0.1.0"
description = "Personal Dota 2 coach: real-time advice + weekly blind-spot analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "edge-tts>=6.1",
    "pyttsx3>=2.90",
    "watchdog>=4.0",
    "anthropic>=0.40",
    "apscheduler>=3.10",
    "vdf>=3.4",
    "scipy>=1.12",
    "click>=8.1",
    "miniaudio>=1.59",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.4",
]

[project.scripts]
dotacoach = "dotacoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotacoach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
